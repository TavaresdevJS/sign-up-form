<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Yuji+Syuku&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="img-container">
        <img src="src/images/cyberpunk.jpg" alt="Japan streets" />
        <div class="logo-space">
          <img class="logo" src="src/images/odin-lined.png" alt="Odin logo" />
          <h1 class="title">ODIN</h1>
        </div>
      </div>
      <div class="sign-up-form">
        <div class="sign-up-title">
          <p class="first-text">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p class="second-text">Sign up <em>now</em> to get started.</p>
          <p>You <em>know </em>you want to.</p>
        </div>
        <form class="form"></form>
        <div class="create-account"></div>
      </div>
    </div>
    <script src="src/js/script.js"></script>
  </body>
</html>
